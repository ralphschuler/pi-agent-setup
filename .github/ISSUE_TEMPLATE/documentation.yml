name: Documentation
description: Request or improve documentation.
title: "Docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: gap
    attributes:
      label: Documentation gap
      description: What is missing, wrong, or unclear?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Audience
      description: Who needs this information?
    validations:
      required: false
  - type: textarea
    id: suggested
    attributes:
      label: Suggested change
      description: What should the docs say or link to?
    validations:
      required: false
