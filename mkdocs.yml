site_name: Custom Pi Agent Setup Wiki
site_description: Documentation for the custom pi agent setup package
site_url: https://ralphschuler.github.io/pi-agent-setup/
repo_url: https://github.com/ralphschuler/pi-agent-setup
repo_name: ralphschuler/pi-agent-setup
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: pink
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Install, update, uninstall: install-update-uninstall.md
  - Validation and testing: validation-testing.md
  - Architecture: architecture.md
  - Extensions:
      - Overview: extensions/index.md
      - Background processes guidance: extensions/background-processes.md
      - Browser bridge: extensions/browser-bridge.md
      - Caveman: extensions/caveman.md
      - Compact footer: extensions/compact-footer.md
      - Cronjobs: extensions/cronjobs.md
      - Custom agents: extensions/custom-agents.md
      - Graph memory: extensions/graph-memory.md
      - Human in loop: extensions/human-in-loop.md
      - Plan workflow: extensions/plan.md
      - Pretty output: extensions/pretty-output.md
      - Processes: extensions/processes.md
      - Safety guard: extensions/safety-guard.md
      - SearXNG search: extensions/searxng.md
      - Subagent orchestrator: extensions/subagent-orchestrator.md
      - Subagents: extensions/subagents.md
      - Tamagotchi: extensions/tamagotchi.md
      - Todo: extensions/todo.md
      - Web terminal: extensions/web-terminal.md
      - Welcome screen: extensions/welcome-screen.md
  - Skills: skills.md
  - Prompts: prompts.md
  - Themes: themes.md
  - Scripts: scripts.md
  - Development: development.md
  - Troubleshooting: troubleshooting.md
